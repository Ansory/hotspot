<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, shrink-to-fit=no">
    <title>terhubung</title>
    <link rel="stylesheet" href="style.css">
	<script language="JavaScript">
$(if advert-pending == 'yes')
    var popup = '';
    function focusAdvert() {
  if (window.focus) popup.focus();
    }
    function openAdvert() {
  popup = open('$(link-advert)', 'hotspot_advert', '');
  setTimeout("focusAdvert()", 1000);
    }
$(endif)
    function openLogout() {
  if (window.name != 'hotspot_status') return true;
        open('$(link-logout)', 'hotspot_logout', 'toolbar=0,location=0,directories=0,status=0,menubars=0,resizable=1,width=280,height=250');
  window.close();
  return false;
    }
</script>
  </head>
  <body $(if advert-pending == 'yes') onLoad="openAdvert()" $(endif) > 
    <div class="page-content-wrapper">
      <div class="container">
        <!-- Offline Area-->
        <div class="offline-area-wrappe py-3 d-flex align-items-center justify-content-center">
          <div class="offline-text text-center"><img class="mb-4 px-5" src="img/terhubung.png" alt="">
            <h5 class="text-success">$(username) terhubung!</h5>
            <p>Layanan terhubung, kode voucher berhasil diverifikasi dengan sisa masa aktif <b>$(session-time-left)</b> </p>
            <p> <b>Gunakanlah dengan bijak! </b></p>
          </div>
        </div>
        <!-- Footer Nav-->
    <div class="footer-nav-area" id="footerNav">
      <div class="container h-100 px-0">
        <div class="apay-footer-nav h-100">
          <ul class="h-100 d-flex align-items-center justify-content-between pl-0">                             
            <li><a href="#"><img src="img/icon/footer/home.png" class="icon1" alt=""><i class="lni lni-hear"></i>Beranda</a></li>
             <li><a href="chat.html"><img src="img/icon/footer/chat.png" class="icon1" alt=""><i class="lni lni-hear"></i>live chat</a></li>
            <li><a href="promo.html"><img src="img/icon/footer/promo.png" class="icon1" alt=""><i class="lni lni"></i>Promo</a></li> 
             <li><a href="help.html"><img src="img/icon/footer/help.png" class="icon1" alt=""><i class="lni lni-hear"></i>Bantuan </a></li>
            <li><a href="$(link-logout)" name="logout" onSubmit="return openLogout()"><img src="img/icon/footer/logout.png" class="icon1" alt=""><i class="lni lni-shopping-baske"></i>Logout</a></li>
            </ul>
        </div>
      </div>
    </div>  
  </body>
</html>
